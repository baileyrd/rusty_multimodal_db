[package]
name = "rusty_multimodal_db"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Benchmark harness comparing AoS, SoA, and UUID-canonical-store views as storage backends"
repository = "https://github.com/baileyrd/rusty_multimodal_db"
license = "MIT"
publish = false

[lib]
name = "rusty_multimodal_db"
path = "src/lib.rs"

# Every bench target below exercises the "internal/research" bucket
# (the benchmarked-alternative backends/variants/strategies, or the
# `bench_support`/`generic_spike` infrastructure that builds their
# datasets) — gated behind the `research` feature the same way that code
# is (see `lib.rs`'s own top-level doc comment), via `required-features`,
# the same mechanism `cache_events`/`scan_ages_crossover` already used for
# `perf-events` below.
[[bench]]
name = "workloads"
harness = false
required-features = ["research"]

[[bench]]
name = "generic_spike"
harness = false
required-features = ["research"]

[[bench]]
name = "order_relation_spike"
harness = false
required-features = ["research"]

[[bench]]
name = "generic_production"
harness = false
required-features = ["research"]

[[bench]]
name = "rule_trace_spike"
harness = false
required-features = ["research"]

[[bench]]
name = "req_traceability_spike"
harness = false
required-features = ["research"]

[[bench]]
name = "cache_events"
harness = false
required-features = ["research", "perf-events"]

[[bench]]
name = "scan_ages_crossover"
harness = false
required-features = ["research", "perf-events"]

[[bench]]
name = "durability"
harness = false
required-features = ["research"]

[[bench]]
name = "concurrency"
harness = false
required-features = ["research"]

# Every integration test below reaches into the same "internal/research"
# bucket (a cross-backend comparison, a durability/concurrency variant, or
# the `Order`/`Customer` reference domain) — same `required-features`
# treatment as the benches above. Explicit `[[test]]` entries are needed
# to attach `required-features` at all (an auto-discovered `tests/*.rs`
# target can't carry per-target config).
[[test]]
name = "cross_backend"
required-features = ["research"]

[[test]]
name = "production_integration"
required-features = ["research"]

[[test]]
name = "generic_production_integration"
required-features = ["research"]

[[test]]
name = "mmap_record_identity_keying"
required-features = ["research"]

# The server integration tests spin up a real TCP listener against the
# `server` feature's `ConnectionStore` adapters. The Dog-domain test only
# needs `server`; the Order/Customer one additionally needs `research`
# (see `src/server/order.rs`'s own module docs).
[[test]]
name = "server_dog_integration"
required-features = ["server"]

[[test]]
name = "server_order_integration"
required-features = ["server", "research"]

[[test]]
name = "server_employee_integration"
required-features = ["server", "research"]

# Same treatment, same reason.
[[example]]
name = "memory_footprint"
required-features = ["research"]

# `crash_writer`/`crash_safety_harness` (the crash-safety diagnosis
# harness) build `Order`/`Customer` datasets via `generic::order_customer`
# and use `bench_support::fresh_temp_dir` — both research-gated. Explicit
# `[[bin]]` entries needed for the same reason as `[[test]]` above.
[[bin]]
name = "crash_writer"
required-features = ["research"]

[[bin]]
name = "crash_safety_harness"
required-features = ["research"]

# `multiprocess_writer`/`multiprocess_harness` (the multi-process access
# diagnosis harness) — same reason as `crash_writer`/`crash_safety_harness`
# above.
[[bin]]
name = "multiprocess_writer"
required-features = ["research"]

[[bin]]
name = "multiprocess_harness"
required-features = ["research"]

# A minimal, real server binary for the `Dog` domain — a hand-written
# three-record sample dataset, not `generator` (research-gated), so this
# builds under `server` alone. See `src/server/mod.rs`'s own doc comment
# for what this binary does and does not provide before running it.
[[bin]]
name = "dog_server"
required-features = ["server"]

[dependencies]
# UUID type + deterministic construction from seeded random bytes (Builder::from_random_bytes
# needs no extra feature — Uuid::new_v4()'s OS-randomness feature is deliberately not enabled,
# since dataset generation must be reproducible from a seed, not OS-random). The "serde" feature
# is new as of the durability work (STORAGE-008/009): WAL entries and snapshots need Uuid to
# (de)serialize.
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# Error type for the one fallible DogStore operation (update_age on an unknown UUID), and for
# DurabilityError (src/durability/mod.rs).
thiserror = "1"
# New as of the durability work (STORAGE-008/009): (De)serialize trait for DogRecord and the
# shared CanonicalCachedState snapshot/WAL-entry shape. The "derive" feature is needed for the
# #[derive(Serialize, Deserialize)] on those types.
serde = { version = "1", features = ["derive"] }
# New as of the durability work: binary (de)serialization for WAL entries and snapshots. Chosen
# over serde_json for the whole durability module (not just the WAL's hot path) — this is a
# benchmark harness, not a tool whose on-disk files need to stay human-readable/debuggable, and
# a single serialization format is one fewer thing to keep consistent across 8 variants.
bincode = "1"
# New as of the durability work, Tier 2 variant 6 only (src/durability/mmap_store.rs): safe(r)
# wrapper over memory-mapped files. The de facto standard crate for this in the Rust ecosystem
# (successor to the unmaintained `memmap`).
memmap2 = "0.9"
# New as of the durability work, Tier 2 variant 8 only (src/durability/embedded_store.rs): a
# pure-Rust, ACID-transactional embedded key-value store (its own on-disk B-tree with MVCC).
# Chosen over `sled` specifically: sled has been in a long-standing "still beta" state with a
# documented history of crash-safety caveats depending on version — a real concern for a
# durability benchmark whose whole point is measuring genuine crash-recoverability. redb is
# younger but built around explicit ACID transactions from the start, with no equivalent
# caveat, and is pure Rust with no C dependency to build/vendor.
redb = "2"
# New as of the concurrency work (STORAGE-010): a sharded, lock-free-for-most-operations
# concurrent hash map. Chosen specifically because variant 3 exists to test "how far do you get
# with an off-the-shelf concurrent map instead of hand-rolling locking" — writing that variant
# without a real concurrent map would just be a worse version of variant 1 or 2. The de facto
# standard crate for this in the Rust ecosystem.
dashmap = "6"

[dependencies.rand]
# Seeded, reproducible RNG for dataset generation (StdRng::seed_from_u64) and for benchmark
# target-UUID selection. Pinned to the well-established 0.8 API rather than the newer 0.10
# line to reduce API-churn risk in a small experimental crate.
version = "0.8"

[dev-dependencies]
# Benchmark harness. Pinned to 0.5 (not the latest 0.8) so it resolves to the same major
# version criterion-perf-events 0.4 depends on, avoiding two copies of criterion in the graph.
criterion = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Wraps Linux perf_event_open for hardware cache-miss counters; Linux-only by construction.
# See ADR-0002 — optional, behind the `perf-events` feature, not part of the default build.
criterion-perf-events = { version = "0.4", optional = true }
# criterion-perf-events' own event-type/builder types (HardwareEventType, PerfCounterBuilderLinux),
# used directly in benches/cache_events.rs to select the CacheMisses/CacheReferences events.
perfcnt = { version = "0.8", optional = true }

[features]
# The "internal/research" bucket: the benchmarked-alternative storage
# backends, durability variants, and concurrency strategies this crate's
# recommendation (`ProductionStore`/`GenericProductionStore`) is built on
# and compared against, plus the dataset-generation/benchmark-support
# infrastructure and historical spike modules — off by default, so a
# consumer depending on this crate doesn't compile any of it in. See
# `lib.rs`'s own top-level doc comment for the full front-door/research
# split.
research = []
# The network server/query layer (`src/server/`) — off by default, distinct
# from `research`: this is new, real, additive capability (ADR-0010,
# Accepted), not a benchmarked-alternative or historical-spike module. No
# new dependency (reuses `bincode`/`serde`/`uuid`, all already present).
# Validating it against the `Order`/`Customer` domain additionally needs
# `research` (see `src/server/order.rs`'s own module docs) since
# `order_customer` itself is research-gated reference material; the `Dog`
# side needs `server` alone. See `src/server/mod.rs`'s own doc comment for
# what this does and does not provide before enabling it.
server = []
perf-events = ["dep:criterion-perf-events", "dep:perfcnt"]

[profile.bench]
opt-level = 3
lto = true
